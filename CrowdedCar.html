<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make your Choice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
        }

        .story-text {
            max-width: 600px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.2em;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            width: 100%;
        }

        .option-box {
            flex: 1;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .option-box:hover {
            transform: scale(1.02);
            cursor: pointer;
        }

        .option-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .option-caption {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-top: 1px solid #ddd;
            color: #333;
        }

        /* Styling for the links to keep them looking clean */
        .option-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
    </style>
</head>
<body>

    <p class="story-text">
        A teenager accidentally bumps into you while dancing.
    </p>

    <div class="options-container">
        <div class="option-box">
            <a href="Madeithome.html" class="option-link">
                <img src="Crowded Car option 1.png" alt="Laughing it off">
                <div class="option-caption">Laugh it off, it’s just NYC.</div>
            </a>
        </div>
        
        <div class="option-box">
            <a href="Panic.html" class="option-link">
                <img src="Crowded Car option 2.png" alt="Scowling">
                <div class="option-caption">Scowl and make a loud comment about "no respect."</div>
            </a>
        </div>
    </div>

</body>
</html>
