<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oral Presentation - Kiara Rodriguez</title>
    <style>
        body {
            /* Consistent soft pink background */
            background-color: #ffe4e1; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #4a4a4a;
        }

        .profile-container {
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #d87093; /* Pale Violet Red */
            margin-bottom: 5px;
            font-size: 2.2em;
        }

        .subtitle {
            font-weight: bold;
            color: #999;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85em;
        }

        .presentation-box {
            background-color: #fffafb;
            border: 2px dashed #ffd1dc;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 40px;
        }

        .presentation-link {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #d87093;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: bold;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 4px 10px rgba(216, 112, 147, 0.3);
            word-break: break-all;
        }

        .presentation-link:hover {
            background: #c76082;
            transform: translateY(-2px);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
            border-top: 1px solid #f9f9f9;
            padding-top: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #d87093;
            background: #fff0f5;
            padding: 12px 35px;
            border-radius: 5px;
            font-size: 0.9em;
            transition: all 0.3s;
            border: 1px solid #ffd1dc;
            font-weight: bold;
        }

        .nav-links a:hover {
            background: #ffd1dc;
            color: white;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>Oral Presentation</h1>
        <div class="subtitle">Final Presentation Deck</div>

        <div class="presentation-box">
            <p style="margin-top: 0;">Click the button below to view the presentation on Canva:</p>
            <a href="https://canva.link/18u3wzrl7aakujp" target="_blank" class="presentation-link">
                View Presentation Link
            </a>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>

</body>
</html>
