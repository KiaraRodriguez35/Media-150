<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Emotive Eye - Kiara Rodriguez</title>
    <style>
        body {
            /* Same soft pink background for consistency */
            background-color: #ffe4e1; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #4a4a4a;
        }

        .profile-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #d87093; /* Pale Violet Red */
            margin-bottom: 5px;
            font-size: 2.2em;
        }

        .subtitle {
            font-weight: bold;
            color: #999;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85em;
        }

        .vector-container {
            margin-bottom: 40px;
        }

        img {
            border-radius: 10px;
            border: 8px solid #fff0f5;
            box-shadow: 0 5px 20px rgba(216, 112, 147, 0.15);
            max-width: 100%;
            height: auto;
            transition: transform 0.4s ease;
        }

        img:hover {
            transform: scale(1.02);
            border-color: #ffd1dc;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
            border-top: 1px solid #f9f9f9;
            padding-top: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #d87093;
            background: #fff0f5;
            padding: 12px 35px;
            border-radius: 5px;
            font-size: 0.9em;
            transition: all 0.3s;
            border: 1px solid #ffd1dc;
            font-weight: bold;
        }

        .nav-links a:hover {
            background: #ffd1dc;
            color: white;
            box-shadow: 0 2px 8px rgba(216, 112, 147, 0.3);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>Vector Emotive Eye</h1>
        <div class="subtitle">Digital Vector Illustration</div>

        <div class="vector-container">
            <img src="eye.png" alt="Vector Emotive Eye Illustration" width="600">
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>

</body>
</html>
