<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Fate is Sealed</title>
    <style>
        body {
            /* A dark, radial blood-red gradient */
            background: radial-gradient(circle, #4a0000 0%, #1a0000 100%);
            color: #bdc3c7;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Subtle flickering effect for the whole page */
        @keyframes flicker {
            0% { opacity: 0.95; }
            5% { opacity: 0.85; }
            10% { opacity: 0.95; }
            70% { opacity: 1; }
            80% { opacity: 0.9; }
            100% { opacity: 1; }
        }

        .story-text {
            max-width: 600px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            letter-spacing: 2px;
            color: #ff0000;
            text-shadow: 2px 2px 10px #000;
            animation: flicker 3s infinite;
            text-transform: uppercase;
        }

        .final-container {
            max-width: 500px;
            width: 100%;
        }

        .option-box {
            background-color: #000;
            border: 2px solid #4a0000;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
        }

        /* Darkening the image to make it moodier */
        .option-box img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(40%) contrast(120%) brightness(70%);
        }

        .option-caption {
            padding: 25px;
            text-align: center;
            font-style: italic;
            font-size: 1.2em;
            border-top: 2px solid #4a0000;
            background-color: #0a0000;
            color: #8b0000;
            line-height: 1.6;
        }

        .restart-button {
            margin-top: 40px;
            padding: 12px 24px;
            background-color: transparent;
            color: #ff0000;
            text-decoration: none;
            border: 1px solid #ff0000;
            border-radius: 0;
            font-size: 1em;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .restart-button:hover {
            background-color: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <p class="story-text">
        Fate has been decided...
    </p>

    <div class="final-container">
        <div class="option-box">
            <img src="Monster.png" alt="The Monster">
            <div class="option-caption">
                Everyone ended up getting eaten by this odd creature... <br>
                <strong>It was your fault.</strong>
            </div>
        </div>
    </div>

    <a href="InteractiveStory.html" class="restart-button">Try Again?</a>

</body>
</html>
